# v2에서 사용하는 Kafka 브로커입니다.
#
# MySQL은 로컬에 직접 설치해 사용합니다. 부하 테스트에서 DB 쓰기 성능을 측정하는데
# 컨테이너를 거치면 디스크 I/O 오버헤드가 측정값에 섞이기 때문입니다.
#
# 기동: docker compose up -d
# 종료: docker compose down
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: notification-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft 모드로 동작합니다. Zookeeper가 필요 없어 컨테이너 하나로 끝납니다.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      # 브로커가 1대이므로 내부 토픽 복제 계수도 1로 맞춥니다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # 컨슈머가 붙을 때 리밸런스를 기다리지 않게 합니다. 로컬 개발 편의용입니다.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # 토픽은 애플리케이션이 명시적으로 생성합니다. 오타로 엉뚱한 토픽이 생기는 것을 막습니다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      # 호스트 경로를 직접 마운트하지 않습니다. Windows 경로를 바인드하면 토픽을 삭제한 뒤
      # Kafka가 남은 디렉터리를 -stray로 옮길 때 rename이 AccessDeniedException으로 실패하고,
      # 로그 디렉터리가 offline 처리되면서 브로커가 기동 중 종료됩니다.
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  kafka-data:
