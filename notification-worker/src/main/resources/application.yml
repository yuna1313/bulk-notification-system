server:
  # notification-api(8080), mock-provider(8081) 다음 자리입니다.
  port: 8082

spring:
  application:
    name: notification-worker

  # notification-api와 같은 DB를 봅니다. 다만 워커가 건드리는 것은 notification_message의
  # 발송 결과 컬럼뿐이고, 스키마를 만들고 바꾸는 것은 notification-api의 몫입니다.
  datasource:
    url: jdbc:mysql://localhost:3306/notification?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # notification-api와 같게 맞췄습니다. 워커 전용 테이블(processed_event)이 없으면 만들고,
      # 공용 테이블은 매핑한 컬럼이 이미 다 있으므로 건드리지 않습니다.
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # 컨슈머 그룹 이름입니다. 같은 그룹에 속한 컨슈머끼리 파티션을 나눠 가지므로,
      # 워커를 여러 개 띄우려면 이 값이 같아야 합니다. 값이 다르면 나눠 갖는 대신
      # 각자 전체 메시지를 중복해서 받습니다.
      group-id: notification-worker
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 이 그룹이 처음 붙을 때 어디부터 읽을지입니다. earliest는 토픽에 남아 있는
      # 가장 오래된 메시지부터 읽습니다.
      auto-offset-reset: earliest
      # 시간이 지났다고 오프셋을 커밋하지 않습니다. 처리하지도 않은 메시지를 처리한 것으로
      # 표시해 유실시키는 것을 막습니다.
      enable-auto-commit: false
    producer:
      # 재시도를 소진한 메시지를 DLQ 토픽으로 옮길 때만 씁니다. 발송 지시를 만들어내지는 않습니다.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # DLQ 발행이 확정되기 전에 성공으로 치면 그 메시지는 어디에도 남지 않고 사라집니다.
      acks: all
    listener:
      # 한 번에 가져온 묶음을 다 처리한 뒤 오프셋을 커밋합니다. 커밋 직전에 죽으면 그 묶음을
      # 다시 받으므로 중복이 생길 수 있습니다. record로 바꾸면 중복 범위가 한 건으로 좁아지는
      # 대신 커밋이 건수만큼 늘어납니다.
      ack-mode: batch
      # 동시에 돌릴 컨슈머 스레드 수입니다. 파티션 수를 넘기면 넘는 만큼은 놀게 됩니다.
      concurrency: 10

notification:
  kafka:
    send-topic:
      # notification-api가 발행하는 토픽과 같아야 합니다.
      name: notification.send

    # 재시도를 소진한 발송 지시가 쌓이는 곳입니다. 워커만 쓰므로 워커가 만듭니다.
    dlq-topic:
      name: notification.send.dlq
      partitions: 10
      replicas: 1
      # 발송 토픽(7일)보다 길게 둡니다. 실패 원인을 확인하고 재처리할 시간이 필요합니다.
      retention-days: 30

  retry:
    # 재시도 사이에 기다리는 시간입니다. 이 시간 동안 해당 파티션은 멈춰 있습니다.
    interval-millis: 1000
    # 최초 시도 이후 추가로 시도할 횟수입니다. 2면 총 3회 시도하고 DLQ로 보냅니다.
    max-retries: 2

  provider:
    base-url: http://localhost:8081
    connect-timeout: 2s
    read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.notification.worker: debug
