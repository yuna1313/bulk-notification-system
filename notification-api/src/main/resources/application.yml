server:
  port: 8080

spring:
  application:
    name: notification-api
  datasource:
    url: jdbc:mysql://localhost:3306/notification?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092

notification:
  kafka:
    send-topic:
      name: notification.send
      # 동시에 발송할 수 있는 컨슈머 수의 상한입니다. 부하 테스트에서 바꿔가며 측정합니다.
      partitions: 10
      replicas: 1
      retention-days: 7

  provider:
    base-url: http://localhost:8081
    connect-timeout: 2s
    read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.notification.api: debug
