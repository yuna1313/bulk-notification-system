spring:
  application:
    name: notification-api
  datasource:
    url: jdbc:h2:mem:notification;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true

notification:
  provider:
    base-url: http://localhost:8081
    connect-timeout: 2s
    read-timeout: 10s
